name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      # Windows에서 만든 lock 파일과 Linux의 선택적 의존성 차이로 npm ci가 실패할 수 있어서
      # npm install을 써요 (lock 파일의 버전은 그대로 지켜요)
      - run: npm install --no-audit --no-fund
      - run: npm run lint
      - run: npm run build # tsc -b + vite build

  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: clickchef
          POSTGRES_PASSWORD: clickchef
          POSTGRES_DB: clickchef
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U clickchef" --health-interval 2s --health-timeout 3s --health-retries 20
    env:
      DATABASE_URL: postgresql://clickchef:clickchef@localhost:5432/clickchef
      VISION_MOCK: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install -r backend/requirements-dev.txt
      - run: python -m pytest -q
        working-directory: backend
